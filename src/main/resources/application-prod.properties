# ---------------------------------------------------------------------------
# Production / docker-compose profile.
#
#   SPRING_PROFILES_ACTIVE=prod
#
# Every value below is supplied by the environment - no defaults, so a missing
# variable fails at startup instead of silently pointing the container at
# localhost or a guest account. docker-compose injects the service hostnames
# (postgres:5432, rabbitmq:5672) and the secrets from .env.
# ---------------------------------------------------------------------------

# --- Datasource ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# --- JPA: never echo SQL, it leaks reviewed source and floods the logs ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.aicode=INFO

# --- Actuator: status only for anonymous callers ---
management.endpoint.health.show-details=when_authorized

# --- Temporary storage cleanup: on ---
# In the container the finally block is the only thing that frees the uploads
# and repositories volumes, and it does not run when the container is killed
# mid-review. Without this the volumes only ever grow.
app.cleanup.enabled=${APP_CLEANUP_ENABLED:true}
