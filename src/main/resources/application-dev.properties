# ---------------------------------------------------------------------------
# Local development profile.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Infrastructure is assumed to be reachable on localhost (either the
# docker-compose containers, whose ports are published, or a native install).
# Hosts default to localhost but stay overridable through the same .env
# variables the project already uses, so an existing .env keeps working.
# Credentials never have a value here - they come from the environment.
# ---------------------------------------------------------------------------

# --- Datasource: localhost:5432 ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:aicode}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- RabbitMQ: localhost:5672 ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- JPA: echo statements while developing ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging: verbose application logs ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.aicode=DEBUG

# --- Actuator: full health detail locally, no authentication involved ---
management.endpoint.health.show-details=always
